services:
  qwen3-tts-api:
    build:
      context: .
    container_name: evido-qwen3-tts
    env_file:
      - .env
    # GPU access is provided by the NVIDIA Container Toolkit on the host.
    environment:
      QWEN_TTS_MODEL_ID: ${QWEN_TTS_MODEL_ID:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      QWEN_TTS_DEVICE_MAP: ${QWEN_TTS_DEVICE_MAP:-cuda}
      QWEN_TTS_DTYPE: ${QWEN_TTS_DTYPE:-bfloat16}
      QWEN_TTS_MAX_INPUT_CHARS: ${QWEN_TTS_MAX_INPUT_CHARS:-2000}
      QWEN_TTS_DEFAULT_LANGUAGE: ${QWEN_TTS_DEFAULT_LANGUAGE:-Auto}
      QWEN_TTS_AUTH_TOKEN: ${QWEN_TTS_AUTH_TOKEN:-}
      HF_HOME: /data/hf
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES}
    expose:
      - "8000"
    volumes:
      - hf-cache:/data/hf
    networks:
      - evido-live-translate

volumes:
  hf-cache:

networks:
  evido-live-translate:
    external: true
